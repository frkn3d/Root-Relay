<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Root & Relay — biyolüminesan ormanda geçen, dikey ve dokunmatik öncelikli bir kule savunma oyunu.">
<meta name="theme-color" content="#12261b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<title>Root & Relay — Tower Defense</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="frame" id="frame">
      <canvas id="game"></canvas>

      <div class="start-screen" id="startScreen">
        <div class="ss-badge">🌿</div>
        <div class="ss-title">Root <span>&</span> Relay</div>
        <div class="ss-sub">biyolüminesan ormanda kule savunması</div>
        <div class="ss-levels" id="ssLevelList"></div>
        <button class="ss-sound sound-toggle-btn" id="soundBtn">🔊 Ses</button>
      </div>

      <div class="top-hud">
        <div class="hud-left">
          <div class="hud-chip"><span class="ic">❤️</span><b id="livesVal">10</b></div>
          <div class="hud-chip" id="goldChip"><span class="ic">🪙</span><b id="goldVal">170</b></div>
        </div>
        <div class="hud-right">
          <div class="hud-chip"><span class="ic">💀</span>Dalga <b id="waveVal">0</b>/<b id="waveMax">8</b></div>
          <div class="hud-icon-row">
            <div class="pauseIcon" id="pauseBtn" title="Duraklat">⏸</div>
            <div class="resetIcon" id="resetBtn" title="Sıfırla">↺</div>
          </div>
        </div>
      </div>

      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">Röle Düştü</h2>
        <div class="overlay-stars" id="overlayStars"></div>
        <p id="overlayText">Dalga 0'da yenildin</p>
        <div class="overlay-actions">
          <button class="btn ghost" id="overlayBtn">Tekrar Dene</button>
          <button class="btn ghost" id="mainMenuBtnOverlay">🏠 Ana Menü</button>
        </div>
      </div>

      <div class="overlay pause-overlay" id="pauseOverlay">
        <h2>⏸ Duraklatıldı</h2>
        <p>Oyun beklemede — devam etmek için dokun</p>
        <div class="pause-actions">
          <button class="btn ghost sound-toggle-btn" id="soundBtnPause">🔊 Ses</button>
          <button class="btn ghost" id="mainMenuBtnPause">🏠 Ana Menü</button>
        </div>
        <button class="btn ghost" id="resumeBtn" style="margin-top:6px;">Devam Et</button>
      </div>

      <div class="tower-panel" id="towerPanel">
        <div class="tp-header">
          <span class="tp-icon" id="tpIcon"></span>
          <div>
            <div class="tp-name" id="tpName"></div>
            <div class="tp-level" id="tpLevel"></div>
          </div>
        </div>
        <div class="tp-stats" id="tpStats"></div>
        <div class="tp-actions" id="tpMainActions">
          <button class="btn upgrade-btn" id="tpUpgradeBtn"></button>
          <button class="btn sell-btn" id="tpSellBtn"></button>
        </div>
        <div class="tp-sell-confirm" id="tpSellConfirm">
          <span id="tpSellConfirmText"></span>
          <div class="tp-sell-confirm-btns">
            <button class="btn ghost" id="tpSellCancel">Vazgeç</button>
            <button class="btn sell-confirm-btn" id="tpSellYes">Evet, Sat</button>
          </div>
        </div>
        <button class="btn ghost" id="tpCloseBtn" style="margin-top:8px; width:100%;">Kapat</button>
      </div>

      <div class="bottom-dock">
        <div class="next-wave-preview" id="wavePreview"></div>
        <div class="tower-drawer" id="towerDrawer"></div>
        <div class="dock-row">
          <button class="tower-select-btn" id="towerSelectBtn"></button>
          <button class="speed-btn" id="speedBtn">1×</button>
          <button class="wave-btn" id="waveBtn">Dalga<br>Başlat</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Sıra önemli: config -> progress -> audio -> engine -> render -> ui -> main -->
<script src="js/config.js"></script>
<script src="js/progress.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
